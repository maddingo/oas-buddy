openapi: 3.0.3
info:
  title: Secured
  version: 1.0.0
security:
  - ApiKeyAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: Key issued by support
      name: X-API-Key
      in: header
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OidcAuth:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    OAuth2Auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/auth
          tokenUrl: https://example.com/token
          scopes:
            read:pets: read your pets
