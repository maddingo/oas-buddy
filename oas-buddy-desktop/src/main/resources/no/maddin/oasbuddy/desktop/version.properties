# Filled in by Maven resource filtering - see <resources> in oas-buddy-desktop/pom.xml. Everything
# the About dialog shows lives here so that no build metadata is duplicated as a Java constant, and
# so a release build's -Drevision=X.Y.Z reaches the running app without a version-bump commit.
#
# A value Maven did not substitute stays as a literal "${...}", which AppInfo reads as absent. That
# is how the fixed number of developer slots below stands in for a list of any length, and how an
# unfiltered classpath (an IDE running straight from target/classes) degrades instead of showing
# placeholder text.
name=${project.parent.name}
version=${project.version}
description=${project.parent.description}
url=${repository.url}
readmeUrl=${repository.url}#readme
contributorsUrl=${repository.url}/graphs/contributors
inceptionYear=${project.inceptionYear}
organization=${project.organization.name}
licenseName=${project.licenses[0].name}
licenseUrl=${project.licenses[0].url}
developer.0.name=${project.developers[0].name}
developer.0.url=${project.developers[0].url}
developer.1.name=${project.developers[1].name}
developer.1.url=${project.developers[1].url}
developer.2.name=${project.developers[2].name}
developer.2.url=${project.developers[2].url}
developer.3.name=${project.developers[3].name}
developer.3.url=${project.developers[3].url}
