name: CI

on:
  push:
    branches: [master]
  pull_request:

# Only ever reads the repository: checkout, then a Maven build. Declared explicitly rather than
# relying on the repository default, which is a setting that can change out from under the workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Xvfb (for JavaFX/TestFX tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: xvfb-run -a mvn -B test
