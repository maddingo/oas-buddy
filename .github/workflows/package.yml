name: Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  jpackage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install rpmbuild (for the .rpm installer)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build installer(s) for this OS
        run: mvn -B -DskipTests -Djpackage package

      - uses: actions/upload-artifact@v7
        with:
          name: oas-buddy-${{ matrix.os }}
          path: oas-buddy-desktop/target/dist/*
          if-no-files-found: error

      - name: Attach installer(s) to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: oas-buddy-desktop/target/dist/*
