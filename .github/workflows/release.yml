name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (no "v" prefix, no -SNAPSHOT)'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z (got '${{ inputs.version }}')"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Trigger package workflow
        # A tag pushed using the default GITHUB_TOKEN does not fire other workflows' `push`
        # triggers (GitHub's anti-recursion guard), so package.yml has to be started explicitly.
        # --ref points it at the tag we just pushed, so it builds and releases that commit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run package.yml --ref "v${{ inputs.version }}"
